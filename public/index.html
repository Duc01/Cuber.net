<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Cuber</title>
	<link rel="stylesheet" href="dist/output.css" />
	<script src="dist/home.bundle.js" defer></script>
</head>

<body class="text-text font-jetbrainsmono">

	<section id="main-content" class="grid grid-cols-primary-grid">
		<section class="w-max-[25rem] w-min-[200px] h-[100vh] w-full overflow-x-hidden bg-side-menu">
			<div
				class="h-[75px] w-[90%] bg-secondary p-4 my-4 mx-auto rounded-lg drop-showdow-xl flex justify-around text-center">
				<div class="flex flex-col">
					<h1 class="text-text font-bold font-spacemono text-xl" id="ao5">
						--:--
					</h1>
					<p class="font-jetbrainsmono text-sm">ao5</p>
				</div>
				<div class="flex flex-col">
					<h1 class="text-text font-bold font-spacemono text-xl" id="ao12">
						--:--
					</h1>
					<p class="font-jetbrainsmono text-sm">ao12</p>
				</div>
			</div>
			<div id="times"></div>
		</section>
		<section id="play-area" class="h-screen flex flex-col" tabindex="-1">
			<nav class="flex content-center justify-around items-center h-[8vh] min-h-[70px] max-h-[150px] bg-nav">
				<div class="40vw flex justify-around content mr-16 ml-auto">
					<button class="mr-8 ml-auto rounded-[0.25] px-2 py-1 border-none z-10"
						onclick="document.location.href='stats.html'">
						Stats
					</button>
					<button
						class="sign-in rounded-md border border-transparent px-4 py-2 bg-secondary text-base leading-6 font-medium text-white shadow-sm hover:bg-secondary-hover focus:outline-none focus:shadow-outline-green transition ease-in-out duration-150 sm:text-sm sm:leading-5"
						onclick="document.location.href='login.html'">
						Sign in
					</button>
					<button class="sign-out mr-16 ml-auto rounded-[0.25rem] bg-secondary px-2 py-1 border-none z-10"
						hidden>
						Sign Out
					</button>
				</div>
			</nav>
			<div class="inset-0 bg-background-main flex justify-center items-center flex-col h-full">
				<h2 class="scramble text-2xl">Scramble</h2>
				<div class="flex flex-row justify-center items-center content-between w-2/5 gap-2 pt-2">
					<select name="puzzles" id="puzzle-changer" class="bg-side-menu text-text text-xl p-1 rounded-md">
						<option value="3X3">3X3X3</option>
						<option value="2X2">2X2X2</option>
					</select>
					<button id="rescramble">
						<?xml version="1.0" encoding="UTF-8"?>
						<svg width="24px" height="24px" stroke-width="1.5" viewBox="0 0 24 24" fill="none"
							xmlns="http://www.w3.org/2000/svg" color="#000000">
							<path
								d="M21.8883 13.5C21.1645 18.3113 17.013 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C16.1006 2 19.6248 4.46819 21.1679 8"
								stroke="#F9E5D7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
							</path>
							<path d="M17 8H21.4C21.7314 8 22 7.73137 22 7.4V3" stroke="#F9E5D7" stroke-width="1.5"
								stroke-linecap="round" stroke-linejoin="round"></path>
						</svg>
					</button>

				</div>
				<h1 id="timer" class="text-[7rem]/[1.4] font-spacemono font-bold">
					00:00.00
				</h1>
				<div class="max-h-[300px] max-w-[400px] border-[#F9E5D726] border bg-side-menu rounded-lg p-4 shadow-xl absolute bottom-4 right-4"
					id="scramble-display"></div>
		</section>
		</div>

	</section>
</body>

</html>
