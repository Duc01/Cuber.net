<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Cuber</title>
		<link rel="stylesheet" href="dist/output.css" />
		<script src="dist/home.bundle.js" defer></script>
	</head>

	<body class="text-text font-jetbrainsmono">
		<nav
			class="flex content-center justify-around items-center h-[8vh] min-h-[70px] max-h-[150px] bg-nav"
		>
			<button
				class="sign-in mr-16 ml-auto rounded-md border border-transparent px-4 py-2 bg-secondary text-base leading-6 font-medium text-white shadow-sm hover:bg-secondary-hover focus:outline-none focus:shadow-outline-green transition ease-in-out duration-150 sm:text-sm sm:leading-5"
				onclick="document.location.href='login.html'"
			>
				Sign in
			</button>
			<button
				class="sign-out mr-16 ml-auto rounded-[0.25rem] bg-secondary px-2 py-1 border-none z-10"
				hidden
			>
				Sign Out
			</button>
		</nav>
		<section id="main-content" class="grid grid-cols-primary-grid">
			<section
				class="w-max-[25rem] w-min-[200px] h-[92vh] w-full overflow-x-hidden bg-side-menu"
			>
				<div
					class="h-[75px] w-[90%] bg-secondary p-4 my-4 mx-auto rounded-lg drop-showdow-xl flex justify-around text-center"
				>
					<div class="flex flex-col">
						<h1
							class="text-text font-bold font-spacemono text-xl"
							id="ao5"
						>
							--:--
						</h1>
						<p class="font-jetbrainsmono text-sm">ao5</p>
					</div>
					<div class="flex flex-col">
						<h1
							class="text-text font-bold font-spacemono text-xl"
							id="ao12"
						>
							--:--
						</h1>
						<p class="font-jetbrainsmono text-sm">ao12</p>
					</div>
				</div>
				<div id="times"></div>
			</section>
			<section
				id="play-area"
				class="inset-0 bg-background-main flex justify-center items-center flex-col"
				tabindex="-1"
			>
				<h2 class="scramble text-2xl">Scramble</h2>
				<button id="rescramble">Rescramble</button>
				<h1 id="timer" class="text-9xl m-2 font-spacemono font-bold">
					00:00.00
				</h1>
				<div
					class="w-[300px] h-[300px] border-[#F9E5D726] border bg-side-menu rounded-lg m-4 p-2 shadow-xl absolute bottom-0 right-0"
					id="scramble-display"
				></div>
			</section>
		</section>
	</body>
</html>
