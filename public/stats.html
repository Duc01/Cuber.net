<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="dist/output.css" />
	<script src="dist/stats.bundle.js" defer></script>
	<title>Stats</title>
</head>

<body>
	<div class="text-text font-jetbrainsmono">
		<nav class="flex content-center justify-around items-start h-[8vh] min-h-[70px] max-h-[150px] bg-nav">
			<h1>Home</h1>
		</nav>
		<section id="stats-content" npx npm-check-updates -u
			class="flex content-center justify-around bg-background-main text-text">

			<div class="transparent w-[60vw] flex items-center flex-col">

				<div class="p-4 m-6 bg-side-menu rounded-lg w-[70vw]">
					<h2 class="mb-4 mt-0 text-center">Scores</h2>
					<canvas id="scores-chart"></canvas>
				</div>
				<div id="ao5-stat" class="p-4 m-6 bg-side-menu rounded-lg">
					<h2>Average of Five</h2>

				</div>
				<div id="ao12-stat" class="p-4 m-6 bg-side-menu rounded-lg">
					<h2>Average of Twelve</h2>
				</div>
				<div>
					<h1>All Times</h1>
				</div>
			</div>
		</section>
	</div>

</body>

</html>
