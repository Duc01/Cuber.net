<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="dist/output.css" />
	<script src="dist/stats.bundle.js" defer></script>
	<title>Stats</title>
</head>

<body>
	<div class="text-text font-jetbrainsmono overflow-hidden">
		<nav class="flex content-center justify-center items-center h-[8vh] min-h-17.5 max-h-37.5 bg-nav">
			<button class="mr-16 ml-auto rounded-[0.25rem] bg-secondary px-2 py-1 border-none z-10"
						onclick="document.location.href='index.html'">
						Home
					</button>
		</nav>
		<section id="stats-content"
			class="flex content-center items-center bg-background-main text-text h-screen flex-col">
			<div class="rounded m-8">
				Puzzle: 
					<select name="puzzles" id="puzzle-changer" class="bg-side-menu text-text text-xl p-1 rounded-md">
						<option value="3X3">3X3X3</option>
						<option value="2X2">2X2X2</option>
					</select>
			</div>
			<div class="transparent w-[60vw] flex items-center flex-col">

				<div class="p-4 m-6 bg-side-menu rounded-lg w-[70vw]">
					<h2 class="mb-4 mt-0 text-center">Scores</h2>
					<canvas id="scores-chart"></canvas>
				</div>
			</div>
		</section>
	</div>

</body>

</html>
